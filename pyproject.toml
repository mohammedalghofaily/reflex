[project]
name = "reflex"
version = "0.1.0"
description = "Fast, private alert triage for SOC analysts: Jev scoring, entity risk store, local LLM fallback."
requires-python = ">=3.11"
dependencies = [
    "typesafe-sdk>=0.7",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
reflex = "reflex.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
